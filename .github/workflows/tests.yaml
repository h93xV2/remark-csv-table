name: Tests

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main

permissions:
    contents: read

jobs:
    test:
        name: test
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v5

            - name: Setup tools
              uses: jdx/mise-action@v5

            - name: Install dependencies
              run: bun ci

            - name: Run tests
              run: bun test --coverage --coverage-reporter=text --coverage-reporter=lcov test/unit test/integration

            - name: Upload coverage
              uses: codecov/codecov-action@v5
              with:
                  files: ./coverage/lcov.info
                  token: ${{ secrets.CODECOV_TOKEN }}
