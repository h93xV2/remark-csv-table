name: Tests

on:
    pull_request:
        branches:
            - main

permissions:
    contents: read

jobs:
    test:
        name: test
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v5

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: "1.4.0"

            - name: Install dependencies
              run: bun ci

            - name: Run tests
              run: bun run test
