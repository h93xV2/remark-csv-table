name: Release

on:
    push:
        branches:
            - main

permissions:
    contents: write
    issues: write
    pull-requests: write

jobs:
    release:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v5
              with:
                  fetch-depth: 0

            - name: Setup Node
              uses: actions/setup-node@v5
              with:
                  node-version: "24.20.0"

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: "1.4.0"

            - name: Install dependencies
              run: bun ci

            - name: Check code
              run: bun run check

            - name: Lint commit
              run: bunx commitlint --last --verbose

            - name: Test
              run: bun test

            - name: Typecheck
              run: bun run typecheck

            - name: Build package
              run: bun run build

            - name: Inspect npm package
              run: npm pack --dry-run --ignore-scripts

            - name: Release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: bunx semantic-release
