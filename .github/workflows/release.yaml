name: Release

on:
    push:
        branches:
            - main

permissions:
    contents: write
    id-token: write
    issues: write
    pull-requests: write

jobs:
    release:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v5
              with:
                  fetch-depth: 0

            - name: Setup tools
              uses: jdx/mise-action@v5

            - name: Install dependencies
              run: bun ci

            - name: Check code
              run: bun run check

            - name: Lint commit
              run: bunx commitlint --last --verbose

            - name: Test
              run: bun run test

            - name: Typecheck
              run: bun run typecheck

            - name: Build package
              run: bun run build

            - name: Test packaged artifact
              run: bun test test/package

            - name: Inspect npm package
              run: npm pack --dry-run --ignore-scripts

            - name: Release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: bunx semantic-release
